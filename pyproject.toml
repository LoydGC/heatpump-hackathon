[project]
name = "heatpump-sizing"
version = "0.1.0"
description = "Heat pump sizing vs. supplemental heat: cost and carbon trade-offs in cold climates"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
